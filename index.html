<script>
const state={role:'Administrator',page:'Dashboard',dark:false};const pages={Administrator:['Dashboard','Room Management','Room Categories','Reservations','Customers','Staff Management','Financial Dashboard','Reports','System Settings'],Cashier:['Dashboard','Reservations','Check-in','Check-out','Payments','Customers'],Customer:['Discover','Rooms','My Reservations','My Profile']};const icons={'Dashboard':'fa-chart-pie','Room Management':'fa-bed','Room Categories':'fa-layer-group','Reservations':'fa-calendar-check','Customers':'fa-users','Staff Management':'fa-user-tie','Financial Dashboard':'fa-coins','Reports':'fa-chart-line','System Settings':'fa-gear','Check-in':'fa-arrow-right-to-bracket','Check-out':'fa-arrow-right-from-bracket','Payments':'fa-credit-card','Discover':'fa-compass','Rooms':'fa-hotel','My Reservations':'fa-ticket','My Profile':'fa-circle-user'};
const roomPics=['photo-1611892440504-42a792e24d32','photo-1590490360182-c33d57733427','photo-1618773928121-c32242e63f39'];function pic(id,w=700){return `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=80`}
function app(){if(state.role==='Customer')return guest();let nav=pages[state.role], admin=state.role==='Administrator';document.getElementById('app').innerHTML=`<div class="shell"><aside class="side"><div class="brand"><i class="fa-solid fa-hotel"></i>MAISON<small>HOTEL GROUP</small></div><div class="navcap">${state.role.toUpperCase()} MENU</div>${nav.map((n,i)=>`<button class="navitem ${state.page===n?'active':''}" onclick="go('${n}')"><i class="fa-solid ${icons[n]||'fa-circle'}"></i>${n}${n==='Reservations'?'<span class="count">8</span>':''}</button>`).join('')}<div class="sidebar-bottom"><div class="profile"><div class="avatar">${admin?'JD':'AM'}</div><div><b>${admin?'Jordan Davis':'Alex Morgan'}</b><small>${state.role}</small></div><i class="fa-solid fa-ellipsis" style="margin-left:auto"></i></div></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="iconbtn mobile-menu" onclick="toast('Navigation menu')"><i class="fa-solid fa-bars"></i></button><div class="crumb">Maison Hotel <span style="padding:0 8px">/</span><b>${state.page}</b></div></div><div class="topright"><select class="role-select" onchange="setRole(this.value)">${['Administrator','Cashier','Customer'].map(r=>`<option ${r===state.role?'selected':''}>${r}</option>`).join('')}</select><button class="iconbtn" onclick="toggleTheme()"><i class="fa-regular fa-moon"></i></button><button class="iconbtn" onclick="toast('You’re all caught up')"><i class="fa-regular fa-bell"></i><i class="dot"></i></button><div class="avatar" style="width:31px;height:31px">${admin?'JD':'AM'}</div></div></header><section class="content">${renderPage()}</section></main></div>`}
function dashboard(){let cashier=state.role==='Cashier';return `<div class="welcome"><div><div class="eyebrow">${cashier?'FRONT DESK OVERVIEW':'MONDAY, NOVEMBER 16, 2026'}</div><h1>${cashier?'Good morning, Alex':'Good morning, Jordan'} <span style="font-family:DM Sans;font-size:23px">✦</span></h1><p>${cashier?'Here’s what’s happening at the front desk today.':'Here’s what’s happening at Maison Hotel today.'}</p></div><div class="actions"><button class="btn" onclick="toast('Report exported')"><i class="fa-solid fa-arrow-down"></i>Export report</button><button class="btn primary" onclick="openBooking()"><i class="fa-solid fa-plus"></i>New reservation</button></div></div><div class="grid stats">${(cashier?[['Check-ins today','12','4 expected soon','fa-arrow-right-to-bracket'],['Check-outs today','8','3 remaining','fa-arrow-right-from-bracket'],['Payments today','$8,420','+12.5% vs yesterday','fa-credit-card'],['Occupied rooms','68','of 84 total','fa-bed']]:[['Total rooms','84','Across 7 categories','fa-hotel'],['Available rooms','26','31% availability','fa-door-open'],['Occupied rooms','52','62% occupancy','fa-bed'],['Revenue this month','$48,290','+12.8% vs last month','fa-coins']]).map(x=>`<article class="card stat"><div class="stathead">${x[0]}<span class="staticon"><i class="fa-solid ${x[3]}"></i></span></div><strong>${x[1]}</strong><div class="delta"><i class="fa-solid fa-arrow-trend-up"></i> ${x[2]} <span>this month</span></div></article>`).join('')}</div><div class="grid midgrid"><article class="card panel"><div class="panelhead"><div><h3>Revenue overview</h3><p>Track your hotel’s financial performance</p></div><select class="select"><option>Last 7 months</option><option>This year</option></select></div><div class="chart"><div class="ylabels"><span>$20k</span><span>$15k</span><span>$10k</span><span>$5k</span><span>$0</span></div><svg viewBox="0 0 700 165" preserveAspectRatio="none"><defs><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c9a45c" stop-opacity=".28"/><stop offset="1" stop-color="#c9a45c" stop-opacity="0"/></linearGradient></defs><path d="M0 137 C45 126 60 107 105 119 S180 91 210 101 S284 71 315 86 S390 50 420 64 S490 32 525 52 S595 28 630 39 S675 13 700 21 L700 165 L0 165Z" fill="url(#fade)"/><path d="M0 137 C45 126 60 107 105 119 S180 91 210 101 S284 71 315 86 S390 50 420 64 S490 32 525 52 S595 28 630 39 S675 13 700 21" fill="none" stroke="#c9a45c" stroke-width="3"/><path d="M0 149 C50 140 70 137 105 142 S172 128 210 134 S280 115 315 124 S390 105 420 114 S493 91 525 102 S600 85 630 94 S672 72 700 82" fill="none" stroke="#263c5e" stroke-width="2" stroke-dasharray="5 5"/></svg><div class="months"><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span></div></div></article><article class="card panel"><div class="panelhead"><div><h3>Room occupancy</h3><p>Current room status breakdown</p></div><button class="btn" style="padding:7px 9px" onclick="go('Room Management')">View rooms</button></div><div class="donutbox"><div class="donut"><div class="donutcenter"><b>62%</b><small>OCCUPANCY</small></div></div><div class="legend"><div><i style="background:#c9a45c"></i>Occupied <b>52</b></div><div><i style="background:#243c62"></i>Available <b>26</b></div><div><i style="background:#75a794"></i>Reserved <b>4</b></div><div><i style="background:#e8ebef"></i>Maintenance <b>2</b></div></div></div></article></div><div class="grid bottomgrid"><article class="card panel"><div class="panelhead"><div><h3>Recent reservations</h3><p>Latest guest bookings and their status</p></div><button class="btn" onclick="go('Reservations')">View all <i class="fa-solid fa-arrow-right"></i></button></div><div class="tablewrap"><table><thead><tr><th>Guest</th><th>Room</th><th>Check in</th><th>Check out</th><th>Amount</th><th>Status</th></tr></thead><tbody>${[['Olivia Rhye','Deluxe Suite','Nov 16','Nov 19','$1,240','Confirmed'],['Phoenix Baker','Ocean King','Nov 16','Nov 20','$1,680','Checked in'],['Lana Steiner','Garden Twin','Nov 17','Nov 19','$760','Pending'],['Demi Wilkinson','Executive','Nov 18','Nov 22','$2,100','Confirmed']].map((x,i)=>`<tr><td><div class="guest"><span class="miniav">${x[0].split(' ').map(s=>s[0]).join('')}</span><b>${x[0]}</b></div></td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td><b>${x[4]}</b></td><td><span class="pill ${i===1?'green':i===2?'gold':'blue'}">${x[5]}</span></td></tr>`).join('')}</tbody></table></div></article><article class="card panel"><div class="panelhead"><div><h3>Recent activity</h3><p>What’s happening at your hotel</p></div><button class="btn" style="padding:7px 10px">Today</button></div><div class="activity">${[['fa-check','New reservation confirmed','Olivia Rhye · Deluxe Suite','+$1,240'],['fa-credit-card','Payment received','Phoenix Baker · #BK-2841','+$840'],['fa-arrow-right-to-bracket','Guest checked in','Ethan Carter · Room 204',''],['fa-bell','Room service requested','Room 312 · Extra towels','']].map(a=>`<div class="activityrow"><span class="activityicon"><i class="fa-solid ${a[0]}"></i></span><div><b>${a[1]}</b><small>${a[2]}</small></div><span class="amount">${a[3]}</span></div>`).join('')}</div></article></div>`}
function renderPage(){if(state.page==='Dashboard')return dashboard();if(['Room Management','Room Categories','Rooms'].includes(state.page))return roomPage();if(state.page==='Reservations'||state.page==='My Reservations')return reservationPage();if(state.page==='Check-in'||state.page==='Check-out'||state.page==='Payments')return cashierWorkflow(state.page);if(state.page==='Customers')return customerPage();if(state.page==='Staff Management')return simplePage('Staff management','Manage your team and access permissions',['Jordan Davis','Alex Morgan','Taylor Kim','Morgan Chen']);if(state.page==='Financial Dashboard')return simplePage('Financial overview','Monitor payments, revenue, and outstanding balances',['Room revenue · November','$48,290','Payments received','$42,120','Outstanding balances','$6,170']);if(state.page==='Reports')return simplePage('Reports & analytics','Hotel performance, at a glance',['Occupancy report','Revenue report','Booking report','Customer report']);if(state.page==='System Settings'||state.page==='My Profile')return settingsPage();return dashboard()}
